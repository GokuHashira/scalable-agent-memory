[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem27"
version = "0.1.0"
description = "Large memory with bounded retrieval and maintenance cost (CMSC 848N Project 27)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real embeddings (torch). Installed on Zaratan only; laptop tests use the stub encoder.
encode = ["sentence-transformers>=3.0", "transformers>=4.51"]  # Qwen3-Embedding needs transformers >= 4.51

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a20",
    "pytest>=8.0",
    "coverage>=7.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mem27"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/mem27"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "\\.\\.\\.",
]
